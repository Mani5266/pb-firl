[project]
name = "pb-firl"
version = "0.1.0"
description = "Per-animal reference baselines for controlled facial-change detection (research prototype)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pyarrow==17.0.0",
    "scikit-learn==1.3.2",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "PyYAML==6.0.3",
    "huggingface-hub==0.26.2",
    "datasets==3.0.2",
]

[project.optional-dependencies]
# NOTE: torch wheels are platform/index-specific and cannot be expressed in
# PEP 508 strings. Install torch FIRST via INSTALL.md (CUDA or CPU), then:
#   pip install -e .   (or pip install -e ".[test]")
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
