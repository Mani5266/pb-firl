[project]
name = "pb-firl"
version = "0.1.0"
description = "Per-animal reference baselines for controlled facial-change detection (research prototype)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pyarrow==17.0.0",
    "scikit-learn==1.3.2",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "PyYAML==6.0.3",
    "huggingface-hub==0.26.2",
    "datasets==3.0.2",
]

[project.optional-dependencies]
cuda121 = [
    "torch==2.1.0+cu121 --index-url https://download.pytorch.org/whl/cu121",
    "torchvision==0.16.0+cu121 --index-url https://download.pytorch.org/whl/cu121",
]
cpu = [
    "torch==2.1.0+cpu --index-url https://download.pytorch.org/whl/cpu",
    "torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
